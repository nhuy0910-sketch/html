  </head>
  <body>
    <header>
      <img src="images/logo.png" alt="Logo Freeze" />
      <nav class="menu">

      </nav>
    </header>
    <main>
      <form>
        <fieldset>
          <legend><b>ĐĂNG KÝ</b></legend>
          <p align="center"></p>
          <p>
            <label><b>Email</b></label>
            <input type="email" placeholder="Vui lòng nhập email" />
          </p>
          <p>
            <label><b>Mật khẩu</b></label>
            <input type="password1" placeholder="Vui lòng nhập mật khẩu" />
          </p>
          <p>
            <label><b>Nhập Lại Mật Khẩu</b></label>
            <input type="password2" placeholder="Vui lòng nhập mật khẩu " />
          </p>
          <p>
            <label
              ><b>Cấp độ thành viên</b
              ><input type="radio" name="crust" value="Bạc" checked />Bạc
            </label>
            <label>
              <input type="radio" name="crust" value="Vàng" />Vàng
            </label>
            <label>
              <input type="radio" name="crust" value="Bạch Kim" />Bạch Kim
            </label>
          </p>

          <p>
            <b>Ảnh đại diện</b>
            <input type="file" accept="images/*" />
          </p>
          <p>
            <b>Thông qua việc tạo tài khoản, bạn đồng ý với</b>
            <a href="#"><i>Điều khoản và quyền riêng tư của chúng tôi.</i></a>
          </p>
          <p>
            <input type="submit" value="Đăng Nhập" />
            <input type="reset" value="Hủy" />
          </p>
        </fieldset>
      </form>
    </main>
    <footer>

      </p>
    </footer>
  </body>
</html>
