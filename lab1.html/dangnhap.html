            <input type="email" placeholder="Nhập email" />

            <input type="password" placeholder="Nhập mật khẩu" />
          </p>
          <p>
            <input type="submit" value="Đăng Nhập" />
            <input type="reset" value="Hủy" />
          </p>

          <p>
            <b>Bạn quên</b>
            <a href="#">Mật khẩu?</a>
            <input type="checkbox" checked />
